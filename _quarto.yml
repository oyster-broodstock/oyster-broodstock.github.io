project:
  type: website
  output-dir: _site
  resources:
    - assets/

website:
  title: "U.S. Oyster Broodstock Systems"
  description: "A USDA NIFA AFRI Sustainable Agricultural Systems Coordinated Agricultural Project building healthier, more resilient oyster seed for American growers."
  site-url: https://oyster-broodstock.github.io
  repo-url: https://github.com/oyster-broodstock/oyster-broodstock.github.io
  favicon: assets/favicon.png
  open-graph: true
  twitter-card: true

  navbar:
    background: primary
    logo: assets/logo-mark-light.svg
    logo-alt: "U.S. Oyster Broodstock Systems"
    title: "Oyster Broodstock Systems"
    left:
      - href: index.qmd
        text: Home
      - href: objectives.qmd
        text: Objectives
      - href: team.qmd
        text: Team
      - href: partners.qmd
        text: Partners
      - href: outputs.qmd
        text: Outputs
      - href: timeline.qmd
        text: Timeline
      - href: news.qmd
        text: News
    right:
      - href: contact.qmd
        text: Contact
      - icon: github
        href: https://github.com/oyster-broodstock
        aria-label: GitHub

  page-footer:
    background: light
    left: |
      This work is supported by the Agriculture and Food Research Initiative
      Sustainable Agricultural Systems program, award no. 2026-68012-47021,
      from the U.S. Department of Agriculture, National Institute of Food and Agriculture.
    right: |
      [GitHub](https://github.com/oyster-broodstock)

format:
  html:
    theme:
      - cosmo
      - styles.scss
    include-in-header:
      - text: |
          <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    toc: true
    toc-depth: 3
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      sidebar-width: 250px
      body-width: 900px
      margin-width: 250px
